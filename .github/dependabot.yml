# Monthly update pull requests: one for the workflows' actions, one for npm.
# Chat SDK (chat, @chat-adapter/*) is grouped on its own, since its packages
# move together and this project tracks it closely (docs/upstream.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Major versions of these are deliberate upgrades, made by hand:
    # - @types/node follows the oldest Node the packages support (engines), so
    #   the code can't use an API that version lacks;
    # - a new TypeScript major changes the compiler's defaults (TypeScript 7
    #   loads no @types on its own), so it comes with its tsconfig changes.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      chat-sdk:
        patterns: ["chat", "@chat-adapter/*"]
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ["chat", "@chat-adapter/*"]
      dependencies:
        dependency-type: production
        exclude-patterns: ["chat", "@chat-adapter/*"]

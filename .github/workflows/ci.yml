# Build, typecheck and test every package on each supported Node version and
# against the oldest Chat SDK the packages support; lint; make an app with the
# starter from the packed packages and run it; and check that a pull request
# changing a package says how in a changeset. The tests run against stand-ins
# for each platform and for Voiceflow: no secrets, no network beyond npm's registry. "all
# checks" passes only when every job does: it's the one check branch
# protection requires.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts this on its version pull request's branch: a
  # pull request opened with the default token starts no workflow of its own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build includes the example apps.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  changeset:
    name: changeset
    # The version pull request removes the changesets it applies, so it's skipped.
    if: ${{ github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: A changed package has a changeset
        run: npx changeset status --since="origin/${{ github.base_ref }}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The channel packages written from one template are as the template writes them.
      - run: node scripts/channels.mjs --check

  oldest-chat:
    name: oldest chat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The floor is read from the peer range, so this follows the claim.
      - name: Install the oldest Chat SDK the packages support
        run: |
          floor=$(node -p "require('./packages/core/package.json').peerDependencies.chat.match(/>=\s*([\d.]+)/)[1]")
          echo "Chat SDK $floor"
          # Chat SDK itself and every adapter this repository is tested with, each at the floor.
          npm install --no-save --no-audit --no-fund $(node -p "Object.keys(require('./package.json').devDependencies).filter((name) => name === 'chat' || name.startsWith('@chat-adapter/')).map((name) => name + '@$floor').join(' ')")
          # The core and every channel's package: not the starter or the examples, which pin the newest.
          echo "PACKAGES=$(node -p "require('./package.json').workspaces.filter((dir) => dir.startsWith('packages/') && dir !== 'packages/create').map((dir) => '-w ' + dir).join(' ')")" >> "$GITHUB_ENV"
      - run: npm run build $PACKAGES
      - run: npm run typecheck $PACKAGES
      - run: npm test $PACKAGES

  starter:
    name: starter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build $(node -p "require('./package.json').workspaces.filter((dir) => dir.startsWith('packages/')).map((dir) => '-w ' + dir).join(' ')")
      # Each app installs the packages as npm would deliver them, builds, and answers a request signed as its channel signs one.
      - name: The starter makes apps that install, build and answer their channels
        run: node packages/create/scripts/smoke.mjs

  all-checks:
    name: all checks
    if: ${{ always() }}
    needs: [test, changeset, lint, oldest-chat, starter]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped job passes: the changeset check runs only on pull requests.
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi

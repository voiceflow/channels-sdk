# Releases run after CI passes on main. With changesets waiting, this opens (or
# updates) a "chore(release): version packages" pull request; merging that pull
# request publishes the new versions to npm, with provenance, and tags them.
#
# npm trusts this workflow through trusted publishing (OIDC), so no npm token is
# stored here. A package marked "private": true is never published.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # The build includes the example apps.
  NEXT_TELEMETRY_DISABLED: "1"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    outputs:
      # The version pull request's number, when this run opened or updated one.
      pull_request: ${{ steps.changesets.outputs.pr-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Open the version pull request, or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # The version pull request is opened with the default token, and GitHub starts
  # no workflow for what that token does: ci would never run on it, "all checks"
  # would never report, and it could not be merged. Starting a workflow outright
  # (workflow_dispatch) is an exception GitHub makes for that token, so ci is
  # started here, on the pull request's branch: its checks are for the same
  # commit the pull request shows.
  #
  # A job of its own, so the job above, which runs the repository's scripts,
  # is not given the permission to start workflows.
  ci-on-version-pr:
    name: ci on the version pull request
    needs: release
    if: ${{ needs.release.outputs.pull_request != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}

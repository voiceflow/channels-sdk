name: Feature request
description: Suggest something new for a package, connect, or a channel's tools.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. For a channel this project doesn't support yet, use **Channel request** instead.

        If what's missing belongs to the platform itself (webhooks, signatures, how messages post), it belongs to Vercel Chat SDK's adapter: [open it on vercel/chat](https://github.com/vercel/chat/issues/new/choose), and link it here if this project needs it too.

  - type: dropdown
    id: package
    attributes:
      label: What would it change?
      multiple: true
      options:
        - "@voiceflow/channels-sdk (the core)"
        - "@voiceflow/channels-slack"
        - "connect"
        - "A channel's tools"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
      placeholder: When my agent ..., I can't ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How it would work for you.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: How you'd use it in code, if it has an API.
      render: typescript

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
